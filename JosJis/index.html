
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to JosJis</title>

<script>
(function () {
    const oldPrefix = "/JosJis";
    const newPrefix = "/josjis";

    const path = window.location.pathname;

    const remainingPath = path.substring(oldPrefix.length);

    const destination =
        window.location.origin +
        newPrefix +
        remainingPath +
        window.location.search +
        window.location.hash;

    window.location.replace(destination);
})();
</script>
</head>
<body>
<p>Redirecting to the new JosJis website...</p>
</body>
</html>
