
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting - JosJis</title>

<script>
(function () {
    const path = window.location.pathname;

    const oldPrefix = "/JosJis";

    if (path.toLowerCase().startsWith(oldPrefix.toLowerCase())) {

        const remainingPath =
            path.substring(oldPrefix.length).toLowerCase();

        const destination =
            "https://josjis-dev.github.io/josjis" +
            remainingPath +
            window.location.search +
            window.location.hash;

        window.location.replace(destination);
    }
})();
</script>
</head>
<body>
<p>Redirecting to the new JosJis website...</p>
</body>
</html>
