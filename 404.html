
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting - JosJis</title>

<script>
(function () {
    const path = window.location.pathname;
    const match = path.match(/^\/JosJis(?:\/|$)/i);

    if (!match) return;

    const remainingPath =
        path.substring("/JosJis".length).toLowerCase();

    const destination =
        "https://josjis-dev.github.io/josjis" +
        remainingPath +
        window.location.search +
        window.location.hash;

    document.write(
        '<meta http-equiv="refresh" content="0;url=' +
        destination.replace(/&/g, '&amp;').replace(/"/g, '&quot;') +
        '">'
    );

    window.location.replace(destination);
})();
</script>
</head>
<body>
<p>Redirecting to the new JosJis website...</p>
</body>
</html>
